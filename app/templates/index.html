<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen">
  <header class="border-b border-slate-200 bg-white/90">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-5">
      <a href="/" class="text-xl font-black tracking-tight text-slate-900">
        Support<span class="text-cyan-600">Desk</span>
      </a>
      <a href="/create" class="rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-bold text-white hover:bg-cyan-700">
        New ticket
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-5 py-10">
    <section class="mb-8">
      <p class="mb-2 text-sm font-bold uppercase tracking-[.2em] text-cyan-600">Operations overview</p>
      <div class="flex flex-col justify-between gap-4 md:flex-row md:items-end">
        <div>
          <h1 class="text-4xl font-black tracking-tight text-slate-950">Customer support tickets</h1>
          <p class="mt-2 text-slate-500">Find, prioritize, and resolve customer issues.</p>
        </div>
      </div>
    </section>

    <section id="stats" class="mb-7 grid grid-cols-3 gap-3"></section>

    <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="mb-5 flex flex-col gap-3 md:flex-row">
        <input id="search" class="field flex-1" placeholder="Search name, ticket ID, email, or description">
        <select id="status" class="field md:w-52">
          <option value="">All statuses</option>
          <option>Open</option>
          <option>In Progress</option>
          <option>Closed</option>
        </select>
      </div>
      <div id="ticket-list" class="space-y-3"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
